name: Release
on:
  push: { tags: "v*.*.*" }
  workflow_dispatch:
  workflow_call:

permissions: {}
jobs:
  release:
    uses: nodenv/.github/.github/workflows/release.yml@01e040ae4850b8e589e1300d71f8af1690000d6a # v7.0.9
    permissions: { contents: write, id-token: write }
    with: { homebrew: false, npm: false }

  sync:
    uses: nodenv/.github/.github/workflows/sync-major-version.yml@01e040ae4850b8e589e1300d71f8af1690000d6a # v7.0.9
    permissions: { contents: write }
